      const newRecord = score > (s.best[i] || 0);
      s.best[i] = Math.max(s.best[i] || 0, score);
      s.stars[i] = Math.max(s.stars[i] || 0, stars);
      s.unlocked = Math.max(s.unlocked, Math.min(LEVELS.length, i + 2));
      this.ui.persist();
      A.play('win');
      this.ui.showWin({ score, stars, best: s.best[i], newRecord, hasNext: i + 1 < LEVELS.length });
    },

    finishLose() {
      this.state = 'lose';
      root.YB.Platform.gameplayStop();
      A.play('lose');
      this.ui.showLose({ adLeft: 2 - this.adBirds, score: this.totalScore() });
    },

    queuePos(i) {
      const r = BIRDS[this.queue[i] || 'normal'].r;
      return { x: SX - 78 - i * 47, y: C.GROUND_Y - r };
    },

    // ---------- Эффекты ----------
    part(p) { p.max = p.life; p.rot = p.rot || rand(0, 6.28); p.vr = p.vr == null ? rand(-8, 8) : p.vr; this.parts.push(p); if (this.parts.length > 400) this.parts.shift(); },
    popup(text, x, y, color, size) { this.part({ kind: 'text', text, x, y, vx: 0, vy: -70, g: 0, s: size || 34, color: color || '#fff', life: 1.1, vr: 0 }); },

    handlers() {
      const G = this;
      return {
        hit(d) { A.play(d.m + 'Hit', { v: d.v, gap: 0.06 }); if (d.v > 0.4) for (let i = 0; i < 2; i++) G.chunk(d.m, d.x, d.y, 0.6); },
        break(d) {
          A.play(d.m + 'Break', { gap: 0.03 });
          const n = Math.max(6, Math.min(18, Math.round((d.w * d.h) / 250)));
          for (let i = 0; i < n; i++) {
            const t = rand(-0.5, 0.5), along = Math.max(d.w, d.h) * t;
            const horiz = d.w >= d.h;
            const lx = horiz ? along : 0, ly = horiz ? 0 : along;
            const x = d.x + lx * Math.cos(d.angle) - ly * Math.sin(d.angle), y = d.y + lx * Math.sin(d.angle) + ly * Math.cos(d.angle);
            G.chunk(d.m, x, y, 1);
          }
          G.part({ kind: 'puff', x: d.x, y: d.y, vx: 0, vy: -20, g: 0, s: 22, color: 'rgba(255,255,255,0.55)', life: 0.5 });
          G.shake = Math.max(G.shake, d.m === 'stone' ? 6 : 3);
        },
        enemyHurt(d) { A.play('enemyHurt', { t: d.t, gap: 0.15 }); },
        enemyDie(d) {
          A.play('enemyDie', { t: d.t, gap: 0.05 });
          const col = d.t === 'blue' ? 'rgba(70,150,250,0.75)' : 'rgba(240,80,60,0.75)';
          for (let i = 0; i < 10; i++) G.part({ kind: 'puff', x: d.x + rand(-15, 15), y: d.y + rand(-15, 15), vx: rand(-160, 160), vy: rand(-200, 40), g: -40, s: rand(12, 22), color: i % 2 ? col : 'rgba(255,255,255,0.85)', life: rand(0.4, 0.8) });
          for (let i = 0; i < 6; i++) G.part({ kind: 'spark', x: d.x, y: d.y, vx: rand(-300, 300), vy: rand(-380, -60), g: 700, s: rand(7, 12), color: '#FFE14D', life: 0.8 });
          G.shake = Math.max(G.shake, d.t === 'boss' ? 16 : 5);
        },
        birdHit(d) {
          A.play('birdHit', { v: d.v, gap: 0.12 });
          if (d.v > 0.3) for (let i = 0; i < 3; i++) G.part({ kind: 'feather', x: d.x, y: d.y, vx: rand(-120, 120), vy: rand(-200, -40), g: 120, s: rand(6, 10), color: R.CHICK[d.type].b, life: 1.2, vr: rand(-4, 4) });
        },
        boost(d) {
          A.play('boost');
          for (let i = 0; i < 10; i++) G.part({ kind: 'puff', x: d.x - Math.cos(d.ang) * i * 8, y: d.y - Math.sin(d.ang) * i * 8, vx: rand(-30, 30), vy: rand(-30, 30), g: 0, s: rand(8, 14), color: 'rgba(255,200,90,0.7)', life: 0.5 });
        },
        explode(d) {
          A.play('explode');
          G.part({ kind: 'ring', x: d.x, y: d.y, vx: 0, vy: 0, g: 0, s: d.R, color: 'rgba(255,230,120,0.9)', life: 0.45, vr: 0 });
          for (let i = 0; i < 26; i++) {
            const a = rand(0, 6.28), sp = rand(100, 520);
            G.part({ kind: 'puff', x: d.x, y: d.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: -60, s: rand(14, 30), color: ['rgba(255,190,40,0.85)', 'rgba(255,120,20,0.8)', 'rgba(90,70,50,0.7)'][i % 3], life: rand(0.4, 0.9) });
          }
          G.shake = 18;
        },
        nuke(d) {
          A.play('nukeBoom', { gap: 0 });
          G.flash = 1; G.shake = 34;
          G.part({ kind: 'ring', x: d.x, y: d.y, vx: 0, vy: 0, g: 0, s: d.R * 1.25, color: 'rgba(255,250,210,0.95)', life: 1.1, vr: 0 });
          G.part({ kind: 'ring', x: d.x, y: d.y, vx: 0, vy: 0, g: 0, s: d.R * 0.8, color: 'rgba(255,170,40,0.9)', life: 0.8, vr: 0 });
          // огненный шар
          for (let i = 0; i < 40; i++) {
            const a = rand(0, 6.28), sp = rand(60, 700);
            G.part({ kind: 'puff', x: d.x, y: d.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, g: -80, s: rand(24, 50), color: ['rgba(255,240,170,0.95)', 'rgba(255,170,40,0.9)', 'rgba(240,90,20,0.85)'][i % 3], life: rand(0.6, 1.4) });
          }
          // ножка гриба
          for (let i = 0; i < 26; i++) G.part({ kind: 'puff', x: d.x + rand(-30, 30), y: d.y - i * 14, vx: rand(-15, 15), vy: rand(-170, -110), g: 30, s: rand(26, 40) - i * 0.4, color: i % 2 ? 'rgba(150,110,80,0.75)' : 'rgba(255,150,50,0.7)', life: rand(2.2, 2.8) });
          // шляпка гриба
          for (let i = 0; i < 34; i++) {
            const a = rand(Math.PI, Math.PI * 2), r = rand(40, 170);
            G.part({ kind: 'puff', x: d.x + Math.cos(a) * r, y: d.y - 380 + Math.sin(a) * r * 0.5, vx: Math.cos(a) * rand(20, 70), vy: rand(-140, -80), g: 25, s: rand(40, 70), color: ['rgba(255,190,90,0.85)', 'rgba(170,120,90,0.8)', 'rgba(110,80,60,0.75)'][i % 3], life: rand(2.4, 3.2) });
          }
          for (let i = 0; i < 30; i++) G.chunk(['wood', 'stone', 'glass'][i % 3], d.x + rand(-60, 60), d.y + rand(-30, 30), 2.2);
        },
        quake() {
          A.play('quake', { gap: 0 });
          for (let i = 0; i < 40; i++) G.part({ kind: 'puff', x: rand(700, 1900), y: C.GROUND_Y - 4, vx: rand(-40, 40), vy: rand(-90, -20), g: 0, s: rand(12, 24), color: 'rgba(160,110,60,0.55)', life: rand(0.6, 1.2) });
        },
        score(d) {
          const big = d.pts >= C.ENEMY_SCORE;
          G.popup('+' + d.pts, d.x, d.y, big ? '#FFE14D' : '#FFFFFF', big ? 48 : 30);
          G.ui.setScore(G.totalScore());
        },
        birdDone(d) {
          A.play('poof');
          for (let i = 0; i < 8; i++) G.part({ kind: 'puff', x: d.x + rand(-12, 12), y: d.y + rand(-12, 12), vx: rand(-60, 60), vy: rand(-80, 0), g: 0, s: rand(10, 18), color: 'rgba(255,255,255,0.85)', life: 0.5 });
          for (let i = 0; i < 4; i++) G.part({ kind: 'feather', x: d.x, y: d.y, vx: rand(-90, 90), vy: rand(-160, -40), g: 100, s: rand(6, 9), color: R.CHICK[d.type].b, life: 1.2, vr: rand(-4, 4) });
        },
      };
    },

    chunk(m, x, y, k) {
      const cols = R.MAT_COLORS[m];
      this.part({ kind: 'chunk', x, y, vx: rand(-260, 260) * k, vy: rand(-380, -40) * k, g: 1100, s: rand(6, 14), color: cols[(Math.random() * cols.length) | 0], life: rand(0.6, 1.1) });
    },

    updateParts(dt) {
      for (const p of this.parts) {
        p.life -= dt; p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        if (p.kind === 'feather') { p.vx *= 0.97; p.vy = Math.min(p.vy, 80); }
        if (p.kind === 'chunk' && p.y > C.GROUND_Y - 3) { p.y = C.GROUND_Y - 3; p.vy *= -0.3; p.vx *= 0.6; p.vr *= 0.5; }
      }
      this.parts = this.parts.filter((p) => p.life > 0);
      this.shake = Math.max(0, this.shake - dt * 40);
    },

    // ---------- Кадр ----------
    frame(now) {
      const dt = Math.min(0.05, this.last ? (now - this.last) / 1000 : 0);
      this.last = now;
      if (this.running()) {
        this.updateNuke(dt);
        // В слоу-мо физика шагает с тем же темпом, но движок сам замедляет время (timeScale),
        // а логика уровня (таймеры) идёт медленнее вместе с ним.
        this.acc += dt;
        let n = 0;
        while (this.acc >= DT && n < 4) { this.sim.step(); this.flow(DT * this.timeScale); this.acc -= DT; n++; }
        if (n === 4) this.acc = 0;
        this.time += dt;
        this.updateParts(dt * (this.timeScale < 1 ? Math.max(0.3, this.timeScale) : 1));
      } else if (this.state === 'menu' || this.state === 'win' || this.state === 'lose') {
        this.time += dt;
        this.updateParts(dt);
      }
      this.draw();
      requestAnimationFrame((t) => this.frame(t));
    },

    draw() {
      const ctx = this.ctx, v = this.view, t = this.time;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const sh = this.shake;
      const shx = sh ? rand(-sh, sh) * v.s : 0, shy = sh ? rand(-sh, sh) * v.s : 0;
      ctx.setTransform(v.s, 0, 0, v.s, v.ox + shx, v.oy + shy);
      R.background(ctx, { x0: v.x0 - 30, x1: v.x1 + 30, y0: v.y0 - 30, y1: v.y1 + 30 }, t);

      if (this.state === 'menu' || !this.sim) { this.drawMenuScene(ctx, t); return; }
      const sim = this.sim;
      R.statics(ctx, sim.statics);
      if (sim.trail.length) R.dots(ctx, sim.trail, 'rgba(255,255,255,0.85)');

      // Птенец на рогатке
      let pouch = null, readyPos = null;
      if (this.ready && (this.phase === 'ready' || this.phase === 'hop')) {
        if (this.phase === 'hop') {
          const from = { x: SX - 78, y: C.GROUND_Y - BIRDS[this.ready].r }, k = this.hopT;
          readyPos = { x: from.x + (SX - from.x) * k, y: from.y + (SY - from.y) * k - Math.sin(k * Math.PI) * 120 };
          if (k > 0.85) pouch = { x: SX, y: SY };
        } else {
          readyPos = this.drag ? { x: SX + this.drag.dx, y: SY + this.drag.dy } : { x: SX, y: SY };
          pouch = readyPos;
        }
      }
      R.slingBack(ctx, pouch);

      for (const b of sim.blocks) R.block(ctx, b);

      const fb = sim.bird;
      for (const e of sim.enemies) {
        const g = e.game;
        let look = Math.PI, scared = false;
        if (fb) { look = Math.atan2(fb.position.y - e.position.y, fb.position.x - e.position.x); scared = Math.hypot(fb.position.x - e.position.x, fb.position.y - e.position.y) < 420; }
        const blink = ((t * 1000 + g.seed * 977) % 3600) < 130;
        if (g.hurtT) g.hurtT--;
        R.dude(ctx, e.position.x, e.position.y, g.r, e.angle, g.t, { hp: g.hp / g.maxHp, look, blink, scared, time: t, squash: g.hurtT ? Math.sin(g.hurtT) * 0.08 : 0 });
      }

      // Очередь птенцов
      this.queue.forEach((type, i) => {
        const p = this.queuePos(i);
        const hop = Math.max(0, Math.sin(t * 2.2 + i * 1.7)) ** 8 * 18;
        R.chick(ctx, p.x, p.y - hop, BIRDS[type].r, 0, type, { blink: ((t * 1000 + i * 1300) % 3000) < 120, time: t });
      });
      for (const b of this.bonusList) R.chick(ctx, b.x, b.y, BIRDS[b.type].r, 0, b.type, { time: t });

      if (readyPos) {
        let ang = 0;
        if (this.drag && Math.hypot(this.drag.dx, this.drag.dy) > 5) ang = Math.atan2(-this.drag.dy, -this.drag.dx);
        const br = BIRDS[this.ready].r * (this.active.power ? 1.35 : 1);
        if (this.active.power) R.aura(ctx, readyPos.x, readyPos.y, br, t);
        R.chick(ctx, readyPos.x, readyPos.y, br, ang, this.ready, { time: t, squash: this.phase === 'hop' ? -Math.sin(this.hopT * Math.PI) * 0.12 : 0 });
      }
      R.slingFront(ctx, pouch, this.ready ? BIRDS[this.ready].r : 26);

      if (fb) {
        const g = fb.game;
        const ang = g.hit ? fb.angle + g.launchAng : Math.atan2(fb.velocity.y, fb.velocity.x);
        if (g.power) R.aura(ctx, fb.position.x, fb.position.y, g.r, t);
        R.chick(ctx, fb.position.x, fb.position.y, g.r, ang, g.type, { time: t });
      }

      // Прицел
      if (this.drag && Math.hypot(this.drag.dx, this.drag.dy) >= 25) {
        const v2 = this.launchVel(this.drag.dx, this.drag.dy);
        if (this.active.sight) {
          // Бустер «Прицел»: полная траектория до земли
          const pts = Sim.predict(SX + this.drag.dx, SY + this.drag.dy, v2.x, v2.y, 400).filter((_, i) => i % 4 === 3);
          R.dots(ctx, pts, '#FF7A00');
        } else {
          const pts = Sim.predict(SX + this.drag.dx, SY + this.drag.dy, v2.x, v2.y, 75).filter((_, i) => i % 3 === 2);
          R.dots(ctx, pts, '#FFFFFF', 22);
        }
      }

      R.particles(ctx, this.parts);
      this.drawNuke(ctx, t);

      // Подсказка-рука на первом уровне
      if (this.levelIdx === 0 && this.shots === 0 && this.phase === 'ready' && !this.drag) this.drawHand(ctx, t);
    },

    drawNuke(ctx, t) {
      const n = this.nuke, v = this.view;
      if (n.mode === 'aim') {
        // затемнение и прицел с зоной поражения
        ctx.fillStyle = 'rgba(40,10,0,0.25)'; ctx.fillRect(v.x0 - 50, v.y0 - 50, v.x1 - v.x0 + 100, v.y1 - v.y0 + 100);
        const p = this.pointer;
        R.nukeTarget(ctx, p.x, p.y, 520, t);
      } else if (n.mode === 'fall') {
        const k = Math.min(1, n.t / 1.5);
        R.nukeTarget(ctx, n.x, n.y, 520, t, 0.6);
        const y = -300 + (n.y + 300) * k * k;
        R.nukeBomb(ctx, n.x, y, t);
      }
      if (this.flash > 0) {
        ctx.fillStyle = `rgba(255,252,235,${Math.min(1, this.flash * 1.3)})`;
        ctx.fillRect(v.x0 - 50, v.y0 - 50, v.x1 - v.x0 + 100, v.y1 - v.y0 + 100);
      }
    },

    drawHand(ctx, t) {
      const k = (t % 1.8) / 1.8, e = k < 0.7 ? k / 0.7 : 1;
      const x = SX - 110 * e, y = SY + 45 * e;
      ctx.save(); ctx.globalAlpha = k < 0.85 ? 0.9 : (1 - k) / 0.15 * 0.9;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 5; ctx.setLineDash([10, 10]);
      ctx.beginPath(); ctx.moveTo(SX, SY); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = R.OUT; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y + 6, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      R.rr(ctx, x - 7, y - 40, 14, 40, 7); ctx.fill(); ctx.stroke();
      ctx.restore();
    },

    drawMenuScene(ctx, t) {
      R.slingBack(ctx, { x: SX, y: SY });
      const bob = (ph) => Math.max(0, Math.sin(t * 2.4 + ph)) ** 6 * 26;
      R.chick(ctx, SX, SY, 26, -0.25, 'normal', { time: t });
      R.slingFront(ctx, { x: SX, y: SY }, 26);
      R.chick(ctx, 200, C.GROUND_Y - 23 - bob(1), 23, 0, 'speed', { time: t });
      R.chick(ctx, 130, C.GROUND_Y - 30 - bob(2.2), 30, 0, 'bomb', { time: t });
      R.dude(ctx, 1560, C.GROUND_Y - 30 - bob(0.5), 30, 0, 'blue', { look: Math.PI, time: t, blink: (t % 3.2) < 0.12 });
      R.dude(ctx, 1660, C.GROUND_Y - 34 - bob(1.6), 34, 0, 'red', { look: Math.PI, time: t, blink: ((t + 1.3) % 3.7) < 0.12 });
      R.dude(ctx, 1760, C.GROUND_Y - 30 - bob(2.7), 30, 0, 'blue', { look: Math.PI, time: t });
      R.particles(ctx, this.parts);
    },
  };

  root.YB = Object.assign(root.YB || {}, { Game });
})(window);

</script>
  <script>/* js/ui.js */
/* YooBird — интерфейс, экраны и запуск игры. */
(function (root) {
  'use strict';
  const { Game, LEVELS, I18n, Audio: A, Platform: P } = root.YB;
  const $ = (s) => document.querySelector(s);
  const MAIN = ['loading', 'menu', 'levels'];
  const LOCK_SVG = '<svg class="lock" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1v12H5V10zm2 0h8V8a4 4 0 1 0-8 0z"/></svg>';

  const UI = {
    save: null, settingsFrom: null, busy: false,

    show(name) {
      MAIN.forEach((n) => $('#screen-' + n).classList.toggle('hidden', n !== name));
      ['#hud', '#boosters', '#nuke-btn'].forEach((sel) => $(sel).classList.toggle('hidden', name !== 'game'));
    },
    modal(name, on) { $('#screen-' + name).classList.toggle('hidden', !on); },
    closeModals() { ['pause', 'win', 'lose', 'settings'].forEach((m) => this.modal(m, false)); },

    // ---------- Вызовы из игры ----------
    setScore(v) { $('#hud-score').textContent = v.toLocaleString('ru-RU'); },
    hideToast() { clearTimeout(this._toastT); $('#toast').classList.add('hidden'); },
    toast(key) {
      const el = $('#toast');
      el.textContent = I18n.t(key);
      el.classList.remove('hidden'); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      clearTimeout(this._toastT);
      this._toastT = setTimeout(() => el.classList.add('hidden'), 3200);
    },
    togglePause() { if ($('#screen-pause').classList.contains('hidden')) this.act('pause'); else this.act('resume'); },
    persist() { P.save(this.save); },

    showWin(r) {
      $('#win-score').textContent = r.score.toLocaleString('ru-RU');
      $('#win-best').textContent = r.best.toLocaleString('ru-RU');
      $('#win-record').classList.toggle('hidden', !r.newRecord);
      $('#btn-next').classList.toggle('hidden', !r.hasNext);
      $('#win-alldone').classList.toggle('hidden', r.hasNext);
      const stars = document.querySelectorAll('#screen-win .stars i');
      stars.forEach((s) => s.classList.remove('on'));
      setTimeout(() => this.modal('win', true), 500);
      for (let i = 0; i < r.stars; i++) setTimeout(() => { stars[i].classList.add('on'); A.play('star', { i, gap: 0 }); }, 1000 + i * 380);
    },
    showLose(r) {
      $('#btn-ad').classList.toggle('hidden', r.adLeft <= 0);
      $('#ad-left').textContent = `(${r.adLeft})`;
      setTimeout(() => this.modal('lose', true), 600);
    },

    // Состояние кнопок бустеров и ядерки
    refreshBoosters() {
      const G = Game;
      ['sight', 'power', 'quake'].forEach((b) => {
        const el = $('#b-' + b), n = G.boosters[b];
        el.querySelector('i').textContent = n;
        el.classList.toggle('used', n <= 0 && !G.active[b]);
        el.classList.toggle('active', !!G.active[b]);
        el.classList.toggle('na', n > 0 && !G.active[b] && (b === 'sight' || b === 'power') && !G.ready);
      });
      const nb = $('#nuke-btn');
      nb.classList.toggle('used', G.nuke.used);
      // Мягко «подмигнуть» один раз за попытку, когда остался последний птенец, а врагов ещё много
      if (!G.nuke.used && !this._tempted && G.sim && G.queue.length === 0 && G.sim.enemiesAlive() >= 2 && G.shots > 0) {
        this._tempted = true; nb.classList.add('tempt'); A.play('nukeOffer');
      }
    },

    // ---------- Экран уровней ----------
    buildLevels() {
      const grid = $('#level-grid'); grid.innerHTML = '';
      LEVELS.forEach((lv, i) => {
        const locked = i + 1 > this.save.unlocked;
        const b = document.createElement('button');
        b.className = 'level-card' + (locked ? ' locked' : '');
        b.dataset.action = 'level'; b.dataset.level = i;
        const st = this.save.stars[i] || 0;
        b.innerHTML = `<span class="num">${i + 1}</span>${locked ? LOCK_SVG : ''}<span class="name">${I18n.t(lv.nameKey)}</span>`
          + `<span class="mini-stars">${[0, 1, 2].map((k) => `<i class="${k < st ? 'on' : ''}"></i>`).join('')}</span>`;
        grid.appendChild(b);
      });
    },

    refreshSettings() {
      const s = this.save.settings;
      $('#tg-music').classList.toggle('on', s.music);
      $('#tg-sfx').classList.toggle('on', s.sfx);
      $('#pz-music').classList.toggle('off', !s.music);
      $('#pz-sfx').classList.toggle('off', !s.sfx);
      document.querySelectorAll('[data-action="lang"]').forEach((b) => b.classList.toggle('active', b.dataset.lang === I18n.lang));
    },

    startLevel(i) {
      this.closeModals();
      clearTimeout(this._toastT); $('#toast').classList.add('hidden');
      this.show('game');
      this._tempted = false; $('#nuke-btn').classList.remove('tempt');
      Game.startLevel(i);
      $('#hud-level').textContent = `${I18n.t('level')} ${i + 1} · ${I18n.t(LEVELS[i].nameKey)}`;
    },

    toMenu() {
      this.closeModals();
      Game.state = 'menu'; Game.sim = null; Game.parts = [];
      P.gameplayStop();
      this.show('menu');
    },

    // Межстраничная реклама в паузе между уровнями, затем действие.
    async withInterstitial(fn) {
      if (this.busy) return;
      this.busy = true;
      try { await P.showInterstitial(); } finally { this.busy = false; }
      fn();
    },

    // ---------- Обработка кнопок ----------
    async act(a, el) {
      const s = this.save;
      switch (a) {
        case 'play': this.startLevel(Math.min(LEVELS.length, s.unlocked) - 1); break;
        case 'levels': this.buildLevels(); this.show('levels'); break;
        case 'settings': this.refreshSettings(); this.modal('settings', true); break;
        case 'back':
          if (!$('#screen-settings').classList.contains('hidden')) this.modal('settings', false);
          else this.show('menu');
          break;
        case 'level': {
          const i = +el.dataset.level;
          if (i + 1 > s.unlocked) { this.toast('locked'); return; }
          this.startLevel(i); break;
        }
        case 'toggle-music': s.settings.music = !s.settings.music; A.setMusic(s.settings.music); this.refreshSettings(); this.persist(); break;
        case 'toggle-sfx': s.settings.sfx = !s.settings.sfx; A.setSfx(s.settings.sfx); this.refreshSettings(); this.persist(); break;
        case 'lang':
          s.settings.lang = el.dataset.lang; I18n.set(s.settings.lang); this.refreshSettings(); this.persist();
          if (Game.def) $('#hud-level').textContent = `${I18n.t('level')} ${Game.levelIdx + 1} · ${I18n.t(Game.def.nameKey)}`;
          break;
        case 'pause':
          if (Game.state !== 'play') return;
          Game.paused = true; Game.drag = null; P.gameplayStop(); this.refreshSettings(); this.modal('pause', true); break;
        case 'resume': this.modal('pause', false); Game.paused = false; P.gameplayStart(); break;
        case 'restart': this.startLevel(Game.levelIdx); break;
        case 'retry': this.startLevel(Game.levelIdx); break;
        case 'menu': this.withInterstitial(() => this.toMenu()); break;
        case 'next': this.withInterstitial(() => this.startLevel(Math.min(LEVELS.length - 1, Game.levelIdx + 1))); break;
        case 'booster':
          if (!Game.useBooster(el.dataset.b)) this.toast('boosterNA');
          break;
        case 'nuke': {
          if (this.busy || !Game.canNuke()) return;
          this.busy = true;
          const ok = await P.showRewarded();
          this.busy = false;
          if (ok && Game.canNuke()) Game.startNukeAim();
          else if (!ok) this.toast('adFail');
          break;
        }
        case 'watch-ad': {
          if (this.busy) return;
          this.busy = true;
          const ok = await P.showRewarded();
          this.busy = false;
          if (ok) { this.modal('lose', false); Game.addExtraBird(); }
          else this.toast('adFail');
          break;
        }
      }
    },

    // Пауза по внешним причинам (реклама, свёрнутое окно): стоп игры и звука.
    extPause(reason, on) {
      const has = Game.extPause.has(reason);
      if (on && !has) {
        Game.extPause.add(reason); Game.drag = null; A.pushPause();
        if (reason !== 'ad' && Game.state === 'play' && !Game.paused) this.act('pause');
      } else if (!on && has) {
        Game.extPause.delete(reason); A.popPause();
      }
    },

    async boot() {
      const bar = $('.loader span');
      bar.style.width = '30%';
      await P.init();
      bar.style.width = '65%';
      const loaded = await P.load();
      this.save = Object.assign({ unlocked: 1, stars: [], best: [], settings: {} }, loaded || {});
      this.save.settings = Object.assign({ music: true, sfx: true, lang: null }, this.save.settings);
      Game.save = this.save;

      I18n.set(this.save.settings.lang || P.lang());
      A.musicOn = this.save.settings.music; A.sfxOn = this.save.settings.sfx;

      P.onPause = (r) => this.extPause(r || 'ad', true);
      P.onResume = (r) => this.extPause(r || 'ad', false);
      document.addEventListener('visibilitychange', () => this.extPause('hidden', document.hidden));
      root.addEventListener('blur', () => { if (Game.state === 'play' && !Game.paused) this.act('pause'); });

      document.addEventListener('click', (e) => {
        const b = e.target.closest('[data-action]');
        if (!b) return;
        A.unlock(); A.play('click');
        this.act(b.dataset.action, b);
      });
      // Первый жест пользователя разблокирует звук и запускает музыку
      const unlock = () => { A.unlock(); A.startMusic(); };
      root.addEventListener('pointerdown', unlock, { once: false, passive: true });
      root.addEventListener('keydown', unlock, { once: false });

      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('selectstart', (e) => e.preventDefault());
      document.addEventListener('dblclick', (e) => e.preventDefault());
      document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

      Game.init($('#game'), this);
      bar.style.width = '100%';
      setTimeout(() => { this.show('menu'); P.loadingReady(); }, 250);
    },
  };

  root.YB.UI = UI;
  root.addEventListener('load', () => UI.boot());
})(window);

</script>
</body>
</html>
