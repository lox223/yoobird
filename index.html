<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFC72C">
  <title>YooBird</title>
  <style>
/* YooBird — стили. Палитру можно подогнать под YooSKINS, поменяв переменные ниже. */
:root {
  --yellow: #FFC72C;
  --yellow-hi: #FFE066;
  --yellow-pale: #FFF6D6;
  --orange: #FF9A1F;
  --dark: #2B1D0E;
  --dark-2: #5A3B12;
  --panel: #FFF3C4;
  --ok: #7BC043;
  --ad: #3D8BFD;
  --font: "Trebuchet MS", "Arial Rounded MT Bold", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: #FFD95A;
  font-family: var(--font); color: var(--dark);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: none; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; }
canvas#game { position: absolute; inset: 0; display: block; touch-action: none; }
.hidden { display: none !important; }

/* ---------- Экраны ---------- */
.screen {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(10px, 2.4vmin, 22px); padding: 16px;
}
#screen-loading { background: radial-gradient(circle at 50% 35%, #FFF1A8, #FFC72C 70%); }
#screen-menu, #screen-levels { background: rgba(255, 214, 80, 0.25); }
.modal { background: rgba(43, 29, 14, 0.55); z-index: 20; }

.logo {
  font-weight: 900; font-size: clamp(56px, 15vmin, 150px); letter-spacing: 1px; line-height: 1;
  color: var(--yellow-hi);
  -webkit-text-stroke: clamp(4px, 1vmin, 9px) var(--dark); paint-order: stroke fill;
  text-shadow: 0 clamp(5px, 1.2vmin, 10px) 0 var(--dark);
  transform: rotate(-4deg);
  animation: logo-bob 3s ease-in-out infinite;
}
.logo span { color: #fff; }
@keyframes logo-bob { 50% { transform: rotate(-2deg) translateY(-6px); } }

.title {
  font-size: clamp(24px, 5.5vmin, 44px); font-weight: 900; color: var(--yellow-hi); text-align: center;
  -webkit-text-stroke: 5px var(--dark); paint-order: stroke fill;
}
.muted { color: var(--dark-2); font-weight: 700; font-size: clamp(13px, 2.6vmin, 18px); text-align: center; }

.menu-col { display: flex; flex-direction: column; gap: clamp(10px, 2vmin, 16px); align-items: stretch; min-width: min(320px, 70vw); }

/* ---------- Кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font); font-weight: 900; font-size: clamp(17px, 3.6vmin, 26px); color: var(--dark);
  background: linear-gradient(#FFE77A, var(--yellow));
  border: 4px solid var(--dark); border-radius: 18px;
  padding: clamp(8px, 1.8vmin, 14px) clamp(18px, 4vmin, 34px);
  box-shadow: 0 6px 0 var(--dark), inset 0 3px 0 rgba(255, 255, 255, 0.6);
  cursor: pointer; transition: transform 0.06s, box-shadow 0.06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--dark), inset 0 3px 0 rgba(255, 255, 255, 0.6); }
.btn svg { width: 1.2em; height: 1.2em; fill: var(--dark); }
.btn-big { font-size: clamp(22px, 5vmin, 36px); background: linear-gradient(#FFEF9C, #FFB800); }
.btn-small { font-size: clamp(14px, 2.8vmin, 20px); padding: 8px 22px; }
.btn-ad { background: linear-gradient(#78B2FF, var(--ad)); color: #fff; }
.btn-ad svg { fill: #fff; }
.btn-next { background: linear-gradient(#B8E986, var(--ok)); }

.icon-btn {
  width: clamp(40px, 8vmin, 56px); height: clamp(40px, 8vmin, 56px);
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(#FFE77A, var(--yellow)); border: 3px solid var(--dark); border-radius: 14px;
  box-shadow: 0 4px 0 var(--dark); cursor: pointer;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--dark); }
.icon-btn svg { width: 60%; height: 60%; fill: var(--dark); stroke: var(--dark); stroke-width: 0; }
.icon-btn svg .wave { stroke-width: 2.2; stroke-linecap: round; }
.icon-btn svg path[d^="M9 18"] { fill: none; stroke-width: 2.2; }
.icon-btn.big { width: clamp(52px, 10vmin, 68px); height: clamp(52px, 10vmin, 68px); }
.icon-btn.off { background: linear-gradient(#E8DCC0, #C9B990); position: relative; }
.icon-btn.off::after {
  content: ""; position: absolute; width: 70%; height: 4px; background: #D43A2A; border-radius: 2px; transform: rotate(-45deg);
  box-shadow: 0 0 0 2px var(--dark);
}

/* ---------- Панели ---------- */
.panel {
  background: var(--panel); border: 5px solid var(--dark); border-radius: 26px;
  box-shadow: 0 10px 0 var(--dark), inset 0 0 0 6px #FFE27A;
  padding: clamp(16px, 3.5vmin, 30px) clamp(20px, 5vmin, 44px);
  display: flex; flex-direction: column; align-items: stretch; gap: clamp(10px, 2vmin, 16px);
  min-width: min(380px, 88vw); max-width: 92vw; max-height: 94vh; overflow: auto;
  animation: pop-in 0.25s cubic-bezier(.2, 1.6, .5, 1);
}
@keyframes pop-in { from { transform: scale(0.7); opacity: 0; } }
.row { display: flex; align-items: center; justify-content: space-between; gap: 20px; font-weight: 900; font-size: clamp(16px, 3.2vmin, 22px); }
.row-btns { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }

.toggle { width: 74px; height: 40px; border-radius: 20px; border: 3px solid var(--dark); background: #CDBF9A; position: relative; cursor: pointer; transition: background 0.15s; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid var(--dark); transition: left 0.15s; }
.toggle.on { background: var(--ok); }
.toggle.on i { left: 37px; }

.seg { display: flex; border: 3px solid var(--dark); border-radius: 12px; overflow: hidden; }
.seg button { font-family: var(--font); font-weight: 900; font-size: 16px; padding: 6px 14px; border: 0; background: #F3E3B0; color: var(--dark); cursor: pointer; }
.seg button + button { border-left: 3px solid var(--dark); }
.seg button.active { background: var(--yellow); }

/* ---------- Уровни ---------- */
.level-grid { display: grid; grid-template-columns: repeat(6, auto); gap: clamp(8px, 1.8vmin, 18px); justify-content: center; }
.level-card {
  width: clamp(78px, min(13vw, 22vh), 150px); aspect-ratio: 1 / 1.05; border-width: 4px; border-radius: 20px;
  background: linear-gradient(#FFF1A8, var(--yellow)); border: 5px solid var(--dark); border-radius: 24px;
  box-shadow: 0 8px 0 var(--dark); cursor: pointer; font-family: var(--font); color: var(--dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative;
}
.level-card:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--dark); }
.level-card .num { font-size: clamp(26px, 6.5vmin, 54px); font-weight: 900; -webkit-text-stroke: 3px var(--dark); color: #fff; paint-order: stroke fill; line-height: 1; }
.level-card .name { font-weight: 900; font-size: clamp(10px, 2vmin, 15px); text-align: center; line-height: 1.1; padding: 0 4px; }
.level-card .mini-stars { display: flex; gap: 3px; }
.level-card .mini-stars i { width: clamp(13px, 2.8vmin, 22px); height: clamp(13px, 2.8vmin, 22px); background: rgba(43,29,14,0.22); clip-path: var(--star); }
.level-card .mini-stars i.on { background: #FF8A00; }
.level-card.locked { background: linear-gradient(#E5DAC0, #C3B48E); cursor: not-allowed; }
.level-card.locked .num { opacity: 0.35; }
.level-card .lock { position: absolute; width: 40%; height: 40%; fill: var(--dark); opacity: 0.85; top: 22%; }

/* ---------- Звёзды ---------- */
:root { --star: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.stars { display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
.stars i { width: clamp(52px, 11vmin, 84px); height: clamp(52px, 11vmin, 84px); background: var(--dark); clip-path: var(--star); position: relative; }
.stars i:nth-child(2) { width: clamp(64px, 14vmin, 104px); height: clamp(64px, 14vmin, 104px); margin-bottom: 10px; }
.stars i::after { content: ""; position: absolute; inset: 12%; clip-path: var(--star); background: #D8C9A0; }
.stars i.on::after { background: linear-gradient(#FFF6B0, #FFC400); animation: star-pop 0.35s cubic-bezier(.2, 1.8, .5, 1); }
@keyframes star-pop { from { transform: scale(0.2); } }
.result-score { text-align: center; font-size: clamp(30px, 7vmin, 52px); font-weight: 900; color: #fff; -webkit-text-stroke: 5px var(--dark); paint-order: stroke fill; }
.badge { background: var(--orange); color: #fff; border-radius: 8px; padding: 2px 8px; margin-left: 4px; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 5;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
.hud-left { display: flex; gap: 10px; }
.hud-title {
  font-weight: 900; font-size: clamp(14px, 3vmin, 22px); background: var(--panel); border: 3px solid var(--dark);
  border-radius: 14px; padding: 6px 14px; box-shadow: 0 4px 0 var(--dark); white-space: nowrap; pointer-events: none !important;
}
.hud-score {
  display: flex; flex-direction: column; align-items: flex-end; font-weight: 900; font-size: clamp(11px, 2vmin, 14px); pointer-events: none !important;
}
.hud-score b { font-size: clamp(22px, 5vmin, 38px); color: #fff; -webkit-text-stroke: 4px var(--dark); paint-order: stroke fill; line-height: 1; }

#toast {
  position: absolute; left: 50%; top: clamp(64px, 14vmin, 100px); transform: translateX(-50%); z-index: 6;
  background: var(--dark); color: var(--yellow-hi); font-weight: 900; font-size: clamp(14px, 3vmin, 22px);
  padding: 10px 20px; border-radius: 14px; border: 3px solid var(--yellow); max-width: 90vw; text-align: center;
  animation: toast-in 0.3s ease-out; pointer-events: none;
}
@keyframes toast-in { from { transform: translate(-50%, -20px); opacity: 0; } }

.loader { width: min(320px, 70vw); height: 22px; border: 4px solid var(--dark); border-radius: 12px; background: var(--yellow-pale); overflow: hidden; }
.loader span { display: block; height: 100%; width: 0; background: var(--orange); transition: width 0.3s; }

#dev-ad { position: absolute; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; }
.dev-ad-box { background: #fff; border-radius: 18px; padding: 30px 40px; text-align: center; font-weight: 900; font-size: 20px; display: flex; flex-direction: column; gap: 16px; }
.dev-ad-bar { width: 260px; height: 12px; background: #ddd; border-radius: 6px; overflow: hidden; }
.dev-ad-bar span { display: block; height: 100%; width: 0; background: var(--ad); }

#rotate { position: absolute; inset: 0; z-index: 100; background: var(--yellow); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-weight: 900; font-size: 22px; text-align: center; padding: 30px; }
#rotate svg { width: 90px; height: 90px; fill: none; stroke: var(--dark); stroke-width: 1.8; animation: rot 2s ease-in-out infinite; }
@keyframes rot { 50% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

/* ---------- Бустеры ---------- */
#boosters {
  position: absolute; z-index: 5; display: flex; flex-direction: column; gap: clamp(6px, 1.4vmin, 12px);
  left: max(12px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + clamp(52px, 10vmin, 70px));
}
.boost {
  position: relative; width: clamp(44px, 8.5vmin, 62px); height: clamp(44px, 8.5vmin, 62px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: linear-gradient(#FFF3B8, #FFD54A); border: 3px solid var(--dark); border-radius: 50%;
  box-shadow: 0 4px 0 var(--dark); cursor: pointer; font-family: var(--font); color: var(--dark);
}
.boost:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--dark); }
.boost svg { width: 46%; height: 46%; fill: var(--dark); stroke: var(--dark); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.boost span { font-size: clamp(7px, 1.4vmin, 10px); font-weight: 900; line-height: 1; }
.boost i {
  position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 4px;
  background: var(--ok); color: #fff; font-style: normal; font-weight: 900; font-size: 12px; line-height: 15px; border: 2px solid var(--dark);
}
.boost.active { background: linear-gradient(#FFB36B, #FF7A00); box-shadow: 0 0 0 4px #fff, 0 4px 0 var(--dark); }
.boost.used { filter: grayscale(1); opacity: 0.45; }
.boost.used i { background: #9A8F78; }
.boost.na { opacity: 0.6; }

/* ---------- Ядерка ---------- */
#nuke-btn {
  position: absolute; z-index: 5;
  right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
  width: clamp(62px, 12vmin, 86px); height: clamp(62px, 12vmin, 86px); border-radius: 50%;
  border: 4px solid var(--dark); background: radial-gradient(circle at 40% 35%, #FFF07A, #FFC400 55%, #F08A00);
  box-shadow: 0 5px 0 var(--dark); cursor: pointer; font-family: var(--font); color: var(--dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: nuke-lure 4s ease-in-out infinite;
}
#nuke-btn .tre { width: 52%; height: 52%; fill: var(--dark); animation: nuke-spin 12s linear infinite; }
#nuke-btn span { font-size: clamp(8px, 1.6vmin, 11px); font-weight: 900; margin-top: -2px; }
#nuke-btn .ad-badge {
  position: absolute; top: -8px; left: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--ad); border: 2px solid var(--dark);
  display: flex; align-items: center; justify-content: center;
}
#nuke-btn .ad-badge svg { width: 14px; height: 14px; fill: #fff; }
#nuke-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--dark); }
#nuke-btn.tempt { animation: nuke-lure 4s ease-in-out infinite, nuke-tempt 1.6s ease-in-out 2; }
#nuke-btn.used { filter: grayscale(1); opacity: 0.35; animation: none; pointer-events: none; }
#nuke-btn.used .tre { animation: none; }
/* Мягкое «манящее» свечение: раз в несколько секунд, без мигания */
@keyframes nuke-lure {
  0%, 70%, 100% { box-shadow: 0 5px 0 var(--dark), 0 0 0 0 rgba(255,140,0,0); }
  82% { box-shadow: 0 5px 0 var(--dark), 0 0 22px 8px rgba(255,150,0,0.55); }
}
@keyframes nuke-spin { to { transform: rotate(360deg); } }
@keyframes nuke-tempt { 50% { transform: scale(1.12) rotate(-6deg); } }
#btn-ad em { font-style: normal; opacity: 0.85; }
@media (prefers-reduced-motion: reduce) { #nuke-btn, #nuke-btn .tre { animation: none !important; } }

</style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- Игровой HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <button class="icon-btn" data-action="pause" aria-label="Пауза">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
        <button class="icon-btn" data-action="restart" aria-label="Заново">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
      </div>
      <div class="hud-title" id="hud-level"></div>
      <div class="hud-score"><span data-i18n="score">Очки</span><b id="hud-score">0</b></div>
    </div>

    <!-- Бустеры: по одному бесплатно за попытку -->
    <div id="boosters" class="hidden">
      <button class="boost" data-action="booster" data-b="sight" id="b-sight" aria-label="Прицел">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none"/><circle cx="12" cy="12" r="2"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5" fill="none"/></svg>
        <i>1</i><span data-i18n="bSight">Прицел</span>
      </button>
      <button class="boost" data-action="booster" data-b="power" id="b-power" aria-label="Мощь">
        <svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>
        <i>1</i><span data-i18n="bPower">Мощь</span>
      </button>
      <button class="boost" data-action="booster" data-b="quake" id="b-quake" aria-label="Землетрясение">
        <svg viewBox="0 0 24 24"><path d="M2 14l3-4 3 6 3-9 3 8 3-5 3 4 2-2" fill="none"/><path d="M2 20h20" fill="none"/></svg>
        <i>1</i><span data-i18n="bQuake">Тряска</span>
      </button>
    </div>

    <!-- Ядерка: за просмотр рекламы, одна на попытку -->
    <button id="nuke-btn" class="hidden" data-action="nuke" aria-label="Ядерный удар">
      <svg viewBox="0 0 24 24" class="tre"><circle cx="12" cy="12" r="2.4"/><path d="M12 12L7.2 3.7A9.6 9.6 0 0 0 2.4 12zM12 12h9.6a9.6 9.6 0 0 0-4.8-8.3zM12 12l-4.8 8.3a9.6 9.6 0 0 0 9.6 0z"/></svg>
      <b class="ad-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></b>
      <span data-i18n="bNuke">Ядерка</span>
    </button>

    <div id="toast" class="hidden"></div>

    <!-- Загрузка -->
    <section id="screen-loading" class="screen">
      <div class="logo">Yoo<span>Bird</span></div>
      <div class="loader"><span></span></div>
      <p class="muted" data-i18n="loading">Загрузка…</p>
    </section>

    <!-- Главное меню -->
    <section id="screen-menu" class="screen hidden">
      <div class="logo">Yoo<span>Bird</span></div>
      <div class="menu-col">
        <button class="btn btn-big" data-action="play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span data-i18n="play">Играть</span>
        </button>
        <button class="btn" data-action="levels"><span data-i18n="levels">Уровни</span></button>
        <button class="btn" data-action="settings"><span data-i18n="settings">Настройки</span></button>
      </div>
    </section>

    <!-- Выбор уровня -->
    <section id="screen-levels" class="screen hidden">
      <h2 class="title" data-i18n="levels">Уровни</h2>
      <div id="level-grid" class="level-grid"></div>
      <button class="btn btn-small" data-action="back"><span data-i18n="back">Назад</span></button>
    </section>

    <!-- Настройки -->
    <section id="screen-settings" class="screen modal hidden">
      <div class="panel">
        <h2 class="title" data-i18n="settings">Настройки</h2>
        <div class="row">
          <span data-i18n="music">Музыка</span>
          <button class="toggle" id="tg-music" data-action="toggle-music"><i></i></button>
        </div>
        <div class="row">
          <span data-i18n="sounds">Звуки</span>
          <button class="toggle" id="tg-sfx" data-action="toggle-sfx"><i></i></button>
        </div>
        <div class="row">
          <span data-i18n="language">Язык</span>
          <div class="seg">
            <button data-action="lang" data-lang="ru">RU</button>
            <button data-action="lang" data-lang="en">EN</button>
          </div>
        </div>
        <button class="btn btn-small" data-action="back"><span data-i18n="back">Назад</span></button>
      </div>
    </section>

    <!-- Пауза -->
    <section id="screen-pause" class="screen modal hidden">
      <div class="panel">
        <h2 class="title" data-i18n="pause">Пауза</h2>
        <button class="btn" data-action="resume"><span data-i18n="resume">Продолжить</span></button>
        <button class="btn" data-action="restart"><span data-i18n="restart">Заново</span></button>
        <div class="row-btns">
          <button class="icon-btn big" data-action="toggle-music" id="pz-music" aria-label="Музыка">
            <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
          </button>
          <button class="icon-btn big" data-action="toggle-sfx" id="pz-sfx" aria-label="Звуки">
            <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none"/></svg>
          </button>
          <button class="icon-btn big" data-action="menu" aria-label="Меню">
            <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Победа -->
    <section id="screen-win" class="screen modal hidden">
      <div class="panel">
        <h2 class="title" data-i18n="winTitle">Уровень пройден!</h2>
        <div class="stars"><i></i><i></i><i></i></div>
        <div class="result-score"><b id="win-score">0</b></div>

  <script>/* js/sim.js */
/* YooBird — физическое ядро (без DOM). Работает и в браузере, и в Node (для тестов). */
(function (root) {
  'use strict';
  const Matter = root.Matter || (typeof require !== 'undefined' ? require('./lib/matter.min.js') : null);
  const { Engine, Bodies, Body, Composite, Events, Sleeping } = Matter;

  const C = {
    W: 1920, H: 1080,
    GROUND_Y: 960,
    SLING_X: 300, SLING_Y: 770,
    MAX_PULL: 150,
    MAX_SPEED: 24,           // px за шаг (1/60 c)
    STEP_MS: 1000 / 60,
    GRAVITY_STEP: 0.001 * (1000 / 60) * (1000 / 60), // ускорение за шаг, как в Matter
    DMG_K: 0.42,
    ENEMY_SCORE: 5000,
    BIRD_BONUS: 10000,
    SETTLE_STEPS: 90,
  };

  const MATERIALS = {
    wood:  { density: 0.0012, friction: 0.7, restitution: 0.05, hp: 110, dmgMul: 1.0, score: 500 },
    glass: { density: 0.0010, friction: 0.3, restitution: 0.05, hp: 55,  dmgMul: 1.4, score: 300 },
    stone: { density: 0.0030, friction: 0.9, restitution: 0.02, hp: 280, dmgMul: 0.6, score: 800 },
  };

  const ENEMIES = {
    blue: { r: 30, hp: 45,  density: 0.0015, score: 5000 },
    red:  { r: 34, hp: 150, density: 0.0018, score: 5000 },
    boss: { r: 46, hp: 460, density: 0.0016, score: 15000 },
  };

  const ZERO = { x: 0, y: 0 };

  const BIRDS = {
    normal: { r: 26, density: 0.0045 },
    speed:  { r: 23, density: 0.0040 },
    bomb:   { r: 30, density: 0.0050 },
  };

  class Sim {
    constructor(cb) { this.cb = cb || {}; }

    emit(type, data) { const f = this.cb[type]; if (f) f(data); }

    load(def) {
      this.def = def;
      this.engine = Engine.create({ enableSleeping: true, positionIterations: 10, velocityIterations: 8 });
      this.world = this.engine.world;
      this.blocks = []; this.enemies = []; this.statics = [];
      this.bird = null; this.trail = []; this.toRemove = [];
      this.score = 0; this.steps = 0; this.damageOn = false;
      this.seed = 0x9E3779B9 ^ (def.id || 1);

      const ground = Bodies.rectangle(C.W / 2, C.GROUND_Y + 250, C.W * 6, 500,
        { isStatic: true, friction: 1, label: 'ground' });
      Composite.add(this.world, ground);

      for (const s of def.statics || []) {
        const b = Bodies.rectangle(s.x, s.y, s.w, s.h, { isStatic: true, friction: 1, label: 'static' });
        b.game = null; b.size = { w: s.w, h: s.h };
        this.statics.push(b);
        Composite.add(this.world, b);
      }

      let seed = 7;
      for (const it of def.items) {
        if (it.k === 'block') {
          const m = MATERIALS[it.m];
          const b = Bodies.rectangle(it.x, it.y, it.w, it.h, {
            density: m.density, friction: m.friction, frictionStatic: 1,
            restitution: m.restitution, angle: it.a || 0, label: 'block',
          });
          const hp = m.hp * Math.max(0.5, Math.min(3, (it.w * it.h) / 3000));
          b.game = { kind: 'block', m: it.m, w: it.w, h: it.h, hp, maxHp: hp, seed: seed++, dead: false };
          this.blocks.push(b);
          Composite.add(this.world, b);
        } else if (it.k === 'enemy') {
          const e = ENEMIES[it.t];
          const b = Bodies.circle(it.x, it.y, e.r, {
            density: e.density, friction: 0.6, restitution: 0.15, label: 'enemy',
          });
          b.game = { kind: 'enemy', t: it.t, r: e.r, hp: e.hp, maxHp: e.hp, seed: seed++, dead: false };
          this.enemies.push(b);
          Composite.add(this.world, b);
        }
      }

      Events.on(this.engine, 'collisionStart', (ev) => this.onCollide(ev));

      // Даём постройкам «осесть» до начала игры, без урона.
      for (let i = 0; i < C.SETTLE_STEPS; i++) Engine.update(this.engine, C.STEP_MS);
      this.damageOn = true;
    }

    onCollide(ev) {
      if (!this.damageOn) return;
      for (const p of ev.pairs) {
        const a = p.bodyA.parent || p.bodyA, b = p.bodyB.parent || p.bodyB;
        if (!a.game && !b.game) continue;
        const n = p.collision.normal;
        // getVelocity — скорость, не зависящая от замедления времени (слоу-мо ядерки)
        const va = a.isStatic ? ZERO : Body.getVelocity(a), vb = b.isStatic ? ZERO : Body.getVelocity(b);
        const rvx = va.x - vb.x, rvy = va.y - vb.y;
        const imp = Math.abs(rvx * n.x + rvy * n.y);
        if (imp < 0.8) continue;
        const ma = a.isStatic ? Infinity : a.mass, mb = b.isStatic ? Infinity : b.mass;
        const mu = ma === Infinity ? mb : (mb === Infinity ? ma : (ma * mb) / (ma + mb));
        const E = 0.5 * mu * imp * imp;
        if (E < 4) continue;
        const dmg = E * C.DMG_K;
        const sp = p.collision.supports && p.collision.supports[0];
        const x = sp ? sp.x : (a.position.x + b.position.x) / 2;
        const y = sp ? sp.y : (a.position.y + b.position.y) / 2;
        this.applyImpact(a, dmg, imp, x, y, b);
        this.applyImpact(b, dmg, imp, x, y, a);
      }
    }

    applyImpact(body, dmg, imp, x, y, other) {
      const g = body.game;
      if (!g || g.dead) return;
      if (g.kind === 'bird') {
        if (!g.hit) { g.hit = true; g.hitT = g.t; }
        this.emit('birdHit', { x, y, v: Math.min(1, imp / 14), type: g.type });
        return;
      }
      if (g.kind === 'block') {
        const d = dmg * MATERIALS[g.m].dmgMul;
        g.hp -= d;
        if (g.hp <= 0) {
          this.destroyBlock(body);
          // Птенец пробивает сломанный блок и летит дальше, теряя часть скорости
          if (other && other.game && other.game.kind === 'bird' && !other.game.passV)
            { const ov = Body.getVelocity(other); other.game.passV = { x: ov.x * 0.7, y: ov.y * 0.7 }; }
        } else if (d > 3) this.emit('hit', { m: g.m, x, y, v: Math.min(1, imp / 12) });
      } else if (g.kind === 'enemy') {
        g.hp -= dmg;
        if (g.hp <= 0) this.killEnemy(body);
        else if (dmg > 3) { g.hurtT = 30; this.emit('enemyHurt', { t: g.t, x: body.position.x, y: body.position.y, v: Math.min(1, dmg / 60) }); }
      }
    }

    addScore(pts, x, y) {
      this.score += pts;
      this.emit('score', { pts, x, y, total: this.score });
    }

    destroyBlock(b, silent) {
      const g = b.game; if (g.dead) return;
      g.dead = true; this.toRemove.push(b);
      if (silent) return;
      this.addScore(MATERIALS[g.m].score, b.position.x, b.position.y);
      this.emit('break', { m: g.m, x: b.position.x, y: b.position.y, w: g.w, h: g.h, angle: b.angle });
    }

    killEnemy(b) {
      const g = b.game; if (g.dead) return;
      g.dead = true; this.toRemove.push(b);
      this.addScore(ENEMIES[g.t].score || C.ENEMY_SCORE, b.position.x, b.position.y - 40);
      this.emit('enemyDie', { t: g.t, x: b.position.x, y: b.position.y, r: g.r });
    }

    flushRemovals() {
      if (!this.toRemove.length) return;
      for (const b of this.toRemove) Composite.remove(this.world, b);
      this.toRemove.length = 0;
      this.blocks = this.blocks.filter((b) => !b.game.dead);
      this.enemies = this.enemies.filter((b) => !b.game.dead);
      this.wakeAll();
    }

    wakeAll() {
      for (const b of Composite.allBodies(this.world)) if (!b.isStatic && b.isSleeping) Sleeping.set(b, false);
    }

    // Детерминированный генератор (чтобы проверка уровней давала повторяемый результат)
    rnd() {
      let t = (this.seed = (this.seed + 0x6D2B79F5) >>> 0);
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    // opts.power — бустер «Мощь»: птенец крупнее и намного тяжелее.
    launch(type, x, y, vx, vy, opts = {}) {
      const bd = BIRDS[type] || BIRDS.normal;
      const r = opts.power ? Math.round(bd.r * 1.35) : bd.r;
      const b = Bodies.circle(x, y, r, {
        density: bd.density * (opts.power ? 2.4 : 1), friction: 0.6, restitution: 0.35, frictionAir: 0.004, label: 'bird',
      });
      b.game = { kind: 'bird', type, r, t: 0, still: 0, hit: false, hitT: 0, used: false, fuse: 0,
        power: !!opts.power, launchAng: Math.atan2(vy, vx) };
      Composite.add(this.world, b);
      Body.setVelocity(b, { x: vx, y: vy });
      this.bird = b;
      this.trail = [];
      return b;
    }

    // Способность птенца по тапу в полёте.
    ability() {
      const b = this.bird;
      if (!b || b.game.used) return false;
      const g = b.game;
      if (g.type === 'speed') {
        if (g.hit) return false;
        g.used = true;
        const v = Body.getVelocity(b), sp = Math.hypot(v.x, v.y) || 1;
        const ns = Math.max(sp * 1.9, 30);
        Body.setVelocity(b, { x: (v.x / sp) * ns, y: (v.y / sp) * ns });
        this.emit('boost', { x: b.position.x, y: b.position.y, ang: Math.atan2(v.y, v.x) });
        return true;
      }
      if (g.type === 'bomb') { this.explode(b); return true; }
      return false;
    }

    explode(bird) {
      const g = bird.game; g.used = true;
      const x = bird.position.x, y = bird.position.y;
      this.emit('explode', { x, y, R: 230 });
      this.retireBird(true);
      this.blast(x, y, 230, 240, 14, 1);
    }

    // Ядерный удар (за рекламу): огромная ударная волна. Урон спадает квадратично,
    // так что гарантированно сносит только центр, а края — разбрасывает и калечит.
    nuke(x, y) {
      const R = 520;
      this.emit('nuke', { x, y, R });
      this.blast(x, y, R, 700, 16, 2.5);
    }

    // Бустер «Землетрясение»: трясёт все постройки, стекло трескается сильнее всего.
    quake() {
      const Q = { glass: 0.5, wood: 0.25, stone: 0.1 };
      this.emit('quake', {});
      for (const b of this.blocks) {
        if (b.game.dead) continue;
        Sleeping.set(b, false);
        const bv = Body.getVelocity(b);
        Body.setVelocity(b, { x: bv.x + (this.rnd() - 0.5) * 4, y: bv.y - this.rnd() * 3 });
        Body.setAngularVelocity(b, b.angularVelocity + (this.rnd() - 0.5) * 0.06);
        b.game.hp -= b.game.maxHp * Q[b.game.m];
        if (b.game.hp <= 0) this.destroyBlock(b);
      }
      for (const e of this.enemies) {
        if (e.game.dead) continue;
        Sleeping.set(e, false);
        const ev = Body.getVelocity(e);
        Body.setVelocity(e, { x: ev.x + (this.rnd() - 0.5) * 3, y: ev.y - 2 - this.rnd() * 2 });
      }
    }

    blast(x, y, R, dmgMax, push, curve) {
      for (const b of [...this.blocks, ...this.enemies]) {
        if (b.game.dead) continue;
        const dx = b.position.x - x, dy = b.position.y - y;
        const d = Math.hypot(dx, dy) || 1;
        const size = b.game.kind === 'enemy' ? b.game.r : Math.min(b.game.w, b.game.h) / 2;
        const f = 1 - Math.max(0, d - size) / R;
        if (f <= 0) continue;
        const dv = push * f * Math.min(1.5, 2.5 / Math.sqrt(b.mass));
        Sleeping.set(b, false);
        const bv = Body.getVelocity(b);
        Body.setVelocity(b, { x: bv.x + (dx / d) * dv, y: bv.y + (dy / d) * dv - 2 * f });
        Body.setAngularVelocity(b, b.angularVelocity + (this.rnd() - 0.5) * 0.2 * f);
        const dmg = dmgMax * Math.pow(f, curve);
        if (b.game.kind === 'block') {
          b.game.hp -= dmg * MATERIALS[b.game.m].dmgMul;
          if (b.game.hp <= 0) this.destroyBlock(b);
        } else {
          b.game.hp -= dmg;
          if (b.game.hp <= 0) this.killEnemy(b);
          else { b.game.hurtT = 30; this.emit('enemyHurt', { t: b.game.t, x: b.position.x, y: b.position.y, v: 1 }); }
        }
      }
    }

    retireBird(silent) {
      const b = this.bird; if (!b) return;
      Composite.remove(this.world, b);
      this.bird = null;
      if (!silent) this.emit('birdDone', { x: b.position.x, y: b.position.y, type: b.game.type });
    }

    step() {
      this.steps++;
      Engine.update(this.engine, C.STEP_MS);
      this.flushRemovals();

      const b = this.bird;
      if (b) {
        const g = b.game; g.t++;
        if (g.passV) { Body.setVelocity(b, g.passV); g.passV = null; }
        if (!g.hit && g.t % 3 === 0) this.trail.push({ x: b.position.x, y: b.position.y });
        if (g.type === 'bomb' && !g.used && g.hit) {
          g.fuse++;
          if (g.fuse > 75) this.explode(b);
        }
        if (this.bird) {
          g.still = Body.getSpeed(b) < 0.35 ? g.still + 1 : 0;
          const out = b.position.x > C.W + 250 || b.position.x < -250 || b.position.y > C.H + 150;
          if (g.still > 50 || g.t > 720 || out || (g.hit && g.t - g.hitT > 240)) this.retireBird(out);
        }
      }

      // Вылетевшие за пределы мира объекты
      for (const e of this.enemies) {
        const p = e.position;
        if (!e.game.dead && (p.x < -200 || p.x > C.W + 300 || p.y > C.H + 200)) this.killEnemy(e);
      }
      for (const bl of this.blocks) {
        const p = bl.position;
        if (!bl.game.dead && (p.x < -300 || p.x > C.W + 400 || p.y > C.H + 300)) this.destroyBlock(bl, true);
      }
      this.flushRemovals();
    }

    enemiesAlive() { return this.enemies.length; }

    // Замедление времени (слоу-мо). Урон считается по нормированным скоростям, поэтому не меняется.
    setTimeScale(ts) { this.engine.timing.timeScale = ts; }

    isQuiet() {
      for (const b of Composite.allBodies(this.world)) {
        if (b.isStatic || b.isSleeping) continue;
        if (Body.getSpeed(b) > 0.2 || Math.abs(b.angularVelocity) / this.engine.timing.timeScale > 0.01) return false;
      }
      return true;
    }

    // Предсказание траектории (та же интеграция, что и в Matter)
    static predict(x, y, vx, vy, steps, fa = 0.004) {
      const pts = [];
      for (let i = 0; i < steps; i++) {
        vx *= 1 - fa; vy = vy * (1 - fa) + C.GRAVITY_STEP;
        x += vx; y += vy;
        pts.push({ x, y });
        if (y > C.GROUND_Y) break;
      }
      return pts;

    // Вызывается на первый жест пользователя (требование браузеров).
    unlock() {
      if (!this.init()) return;
      if (this.ctx.state === 'suspended' && this.externalPause === 0) this.ctx.resume();
      if (this.musicWanted && !this.timer) this._startScheduler();
    },

    pushPause() {
      this.externalPause++;
      if (this.ctx && this.ctx.state === 'running') this.ctx.suspend();
    },
    popPause() {
      this.externalPause = Math.max(0, this.externalPause - 1);
      if (this.externalPause === 0 && this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    setMusic(on) {
      this.musicOn = on;
      if (this.musicBus) this.musicBus.gain.setTargetAtTime(on ? 0.32 : 0, this.ctx.currentTime, 0.05);
      if (on && this.musicWanted) this._startScheduler(); else if (!on) this._stopScheduler();
    },
    setSfx(on) {
      this.sfxOn = on;
      if (this.sfxBus) this.sfxBus.gain.setTargetAtTime(on ? 0.9 : 0, this.ctx.currentTime, 0.02);
    },

    // ---------- Музыка ----------
    startMusic() { this.musicWanted = true; if (this.ctx && this.musicOn) this._startScheduler(); },
    stopMusic() { this.musicWanted = false; this._stopScheduler(); },

    _startScheduler() {
      if (this.timer || !this.ctx || !this.musicOn) return;
      this.nextTime = this.ctx.currentTime + 0.1;
      this.timer = setInterval(() => this._schedule(), 50);
    },
    _stopScheduler() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

    _schedule() {
      const c = this.ctx;
      if (!c || c.state !== 'running') return;
      const stepDur = 60 / BPM / 4;
      if (this.nextTime < c.currentTime - 0.3) this.nextTime = c.currentTime + 0.05;
      while (this.nextTime < c.currentTime + 0.25) {
        this._playStep(this.step, this.nextTime, stepDur);
        this.nextTime += stepDur;
        this.step = (this.step + 1) % (16 * 8);
      }
    },

    _playStep(s, t, sd) {
      const bar = Math.floor(s / 16), i = s % 16, ch = CHORDS[bar];
      const bus = this.musicBus;
      // Мелодия
      const n = MELODY[s];
      if (n && n !== '.') {
        let len = 1; while (len < 4 && MELODY[(s + len) % MELODY.length] === '.') len++;
        this._tone({ type: 'square', f: NOTE[n], t, a: 0.01, d: sd * len * 0.9, vol: 0.07, dest: bus, lp: 2600 });
        this._tone({ type: 'triangle', f: NOTE[n] * 2, t, a: 0.01, d: sd * 1.2, vol: 0.025, dest: bus });
      }
      // Бас
      if (i === 0 || i === 6 || i === 8 || i === 14) {
        const f = NOTE[ch[0]] * (i === 6 || i === 14 ? 2 : 1);
        this._tone({ type: 'triangle', f, t, a: 0.005, d: sd * 1.8, vol: 0.22, dest: bus });
      }
      // Аккордовые «чики» на слабые доли
      if (i % 4 === 2) for (let k = 1; k < 4; k++) this._tone({ type: 'triangle', f: NOTE[ch[k]], t, a: 0.005, d: sd * 0.9, vol: 0.035, dest: bus });
      // Ударные
      if (i === 0 || i === 8 || (i === 10 && bar % 2 === 1)) this._kick(t, bus);
      if (i === 4 || i === 12) this._noise({ t, d: 0.12, vol: 0.12, filter: 'bandpass', freq: 1900, q: 0.8, dest: bus });
      if (i % 2 === 0) this._noise({ t, d: 0.03, vol: i % 4 === 2 ? 0.06 : 0.035, filter: 'highpass', freq: 7500, dest: bus });
    },

    _kick(t, dest) {
      this._tone({ type: 'sine', f: 140, f2: 42, t, a: 0.003, d: 0.16, vol: 0.4, dest });
    },

    // ---------- Примитивы ----------
    _env(g, t, a, d, vol) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    },

    _tone({ type = 'sine', f = 440, f2 = null, t = 0, a = 0.005, d = 0.2, vol = 0.3, dest = null, lp = 0, vib = 0 }) {
      const c = this.ctx;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + a + d);
      let node = o;
      if (lp) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
      if (vib) {
        const l = c.createOscillator(), lg = c.createGain();
        l.frequency.value = vib; lg.gain.value = f * 0.03; l.connect(lg); lg.connect(o.frequency);
        l.start(t); l.stop(t + a + d + 0.05);
      }
      node.connect(g); g.connect(dest || this.sfxBus);
      this._env(g, t, a, d, vol);
      o.start(t); o.stop(t + a + d + 0.05);
    },

    _noise({ t = 0, a = 0.003, d = 0.2, vol = 0.3, filter = 'lowpass', freq = 1000, freq2 = null, q = 1, dest = null }) {
      const c = this.ctx;
      const s = c.createBufferSource(); s.buffer = this.noiseBuf;
      const fl = c.createBiquadFilter(); fl.type = filter; fl.Q.value = q;
      fl.frequency.setValueAtTime(freq, t);
      if (freq2) fl.frequency.exponentialRampToValueAtTime(freq2, t + a + d);
      const g = c.createGain();
      s.connect(fl); fl.connect(g); g.connect(dest || this.sfxBus);
      this._env(g, t, a, d, vol);
      s.start(t, Math.random() * 1.5); s.stop(t + a + d + 0.05);
    },

    // Приглушить музыку на время (ядерный взрыв), затем плавно вернуть.
    duck(sec) {
      if (!this.ctx || !this.musicOn) return;
      const g = this.musicBus.gain, t = this.ctx.currentTime;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(0.03, t + 0.3);
      g.setValueAtTime(0.03, t + sec - 1.5);
      g.linearRampToValueAtTime(0.32, t + sec);
    },

    // ---------- Звуковые эффекты ----------
    play(name, o = {}) {
      if (!this.ctx || !this.sfxOn || this.ctx.state !== 'running') return;
      const now = this.ctx.currentTime;
      const gap = o.gap != null ? o.gap : 0.045;
      if (this.last[name] && now - this.last[name] < gap) return;
      this.last[name] = now;
      const fn = SFX[name];
      if (fn) fn.call(this, now, o.v == null ? 1 : o.v, o);
    },
  };

  const rand = (a, b) => a + Math.random() * (b - a);

  const SFX = {
    click(t) {
      this._tone({ type: 'square', f: 660, f2: 990, t, d: 0.06, vol: 0.12, lp: 3000 });
    },
    grab(t) {
      this._tone({ type: 'sawtooth', f: 180, f2: 320, t, d: 0.12, vol: 0.08, lp: 900 });
      this._tone({ type: 'sine', f: 1800, f2: 2300, t: t + 0.02, d: 0.05, vol: 0.08 });
    },
    hop(t) {
      this._tone({ type: 'sine', f: 520, f2: 980, t, d: 0.09, vol: 0.12 });
    },
    launch(t) {
      // резинка
      this._tone({ type: 'triangle', f: 210, f2: 85, t, d: 0.25, vol: 0.35 });
      // свист воздуха
      this._noise({ t, a: 0.02, d: 0.4, vol: 0.22, filter: 'bandpass', freq: 600, freq2: 2600, q: 1.5 });
      // чирик птенца
      this._tone({ type: 'sine', f: 1500, f2: 2600, t: t + 0.03, d: 0.07, vol: 0.18 });
      this._tone({ type: 'sine', f: 1700, f2: 3000, t: t + 0.12, d: 0.08, vol: 0.16 });
      this._tone({ type: 'sine', f: 2000, f2: 3200, t: t + 0.22, d: 0.06, vol: 0.12 });
    },
    birdHit(t, v) {
      this._tone({ type: 'sine', f: 2400, f2: 1400, t, d: 0.09, vol: 0.12 * v + 0.04 });
      this._noise({ t, d: 0.06, vol: 0.12 * v, filter: 'lowpass', freq: 1200 });
    },
    boost(t) {
      this._noise({ t, a: 0.01, d: 0.35, vol: 0.3, filter: 'bandpass', freq: 700, freq2: 4500, q: 2 });
      this._tone({ type: 'sawtooth', f: 300, f2: 1400, t, d: 0.22, vol: 0.08, lp: 2500 });
      this._tone({ type: 'sine', f: 2200, f2: 3400, t: t + 0.02, d: 0.08, vol: 0.14 });
    },
    explode(t) {
      this._noise({ t, a: 0.005, d: 0.9, vol: 0.8, filter: 'lowpass', freq: 2400, freq2: 90, q: 0.7 });
      this._tone({ type: 'sine', f: 120, f2: 28, t, d: 0.7, vol: 0.7 });
      this._noise({ t: t + 0.05, d: 0.5, vol: 0.2, filter: 'highpass', freq: 2500 });
    },
    poof(t) {
      this._noise({ t, a: 0.02, d: 0.18, vol: 0.12, filter: 'bandpass', freq: 1300, q: 1.2 });
      this._tone({ type: 'sine', f: 900, f2: 1600, t, d: 0.08, vol: 0.05 });
    },
    enemyHurt(t, v, o) {
      const base = { red: 300, boss: 190 }[o.t] || 460;
      this._tone({ type: 'sawtooth', f: base * 1.35, f2: base * 0.8, t, a: 0.01, d: 0.2, vol: 0.14, lp: 1600, vib: 18 });
      this._tone({ type: 'square', f: base * 2.6, f2: base * 1.6, t: t + 0.02, d: 0.08, vol: 0.04, lp: 2500 });
    },
    enemyDie(t, v, o) {
      const base = { red: 260, boss: 150 }[o.t] || 400;
      if (o.t === 'boss') this._tone({ type: 'sine', f: 90, f2: 30, t, d: 0.6, vol: 0.5 });
      this._noise({ t, a: 0.002, d: 0.22, vol: 0.4, filter: 'lowpass', freq: 3500, freq2: 300 });
      this._tone({ type: 'sine', f: 900, f2: 300, t, d: 0.06, vol: 0.25 });
      this._tone({ type: 'sawtooth', f: base * 1.5, f2: base * 0.35, t: t + 0.05, d: 0.55, vol: 0.14, lp: 1400, vib: 9 });
      this._tone({ type: 'triangle', f: 1300, f2: 2400, t: t + 0.12, d: 0.12, vol: 0.08 });
    },
    woodHit(t, v) {
      this._noise({ t, d: 0.09, vol: 0.22 * v + 0.05, filter: 'bandpass', freq: rand(350, 520), q: 3 });
      this._tone({ type: 'sine', f: rand(150, 190), f2: 100, t, d: 0.1, vol: 0.18 * v + 0.04 });
    },
    woodBreak(t) {
      for (let i = 0; i < 4; i++) this._noise({ t: t + i * rand(0.02, 0.04), d: 0.08, vol: 0.25, filter: 'bandpass', freq: rand(300, 900), q: 2.5 });
      this._tone({ type: 'sine', f: 110, f2: 55, t, d: 0.22, vol: 0.3 });
      this._tone({ type: 'square', f: rand(200, 260), f2: 120, t: t + 0.03, d: 0.06, vol: 0.05, lp: 900 });
    },
    glassHit(t, v) {
      this._tone({ type: 'sine', f: rand(2400, 3200), t, d: 0.18, vol: 0.1 * v + 0.03 });
      this._tone({ type: 'sine', f: rand(3600, 4400), t, d: 0.1, vol: 0.05 * v + 0.02 });
    },
    glassBreak(t) {
      this._noise({ t, a: 0.002, d: 0.35, vol: 0.3, filter: 'highpass', freq: 3000 });
      for (let i = 0; i < 7; i++) this._tone({ type: 'sine', f: rand(2000, 5200), t: t + rand(0, 0.18), d: rand(0.06, 0.16), vol: 0.06 });
    },
    stoneHit(t, v) {
      this._tone({ type: 'sine', f: 95, f2: 55, t, d: 0.16, vol: 0.3 * v + 0.08 });
      this._noise({ t, d: 0.12, vol: 0.2 * v + 0.05, filter: 'lowpass', freq: 600 });
    },
    stoneBreak(t) {
      this._noise({ t, a: 0.005, d: 0.55, vol: 0.45, filter: 'lowpass', freq: 900, freq2: 180 });
      this._tone({ type: 'sine', f: 75, f2: 38, t, d: 0.35, vol: 0.4 });
      for (let i = 0; i < 3; i++) this._noise({ t: t + 0.1 + i * 0.07, d: 0.06, vol: 0.15, filter: 'bandpass', freq: rand(400, 800), q: 2 });
    },
    score(t) {
      this._tone({ type: 'square', f: 880, t, d: 0.07, vol: 0.06, lp: 3000 });
      this._tone({ type: 'square', f: 1320, t: t + 0.07, d: 0.1, vol: 0.06, lp: 3000 });
    },
    bonus(t) {
      this._tone({ type: 'triangle', f: 1046, t, d: 0.1, vol: 0.15 });
      this._tone({ type: 'triangle', f: 1568, t: t + 0.08, d: 0.18, vol: 0.15 });
      this._tone({ type: 'sine', f: 2093, t: t + 0.08, d: 0.2, vol: 0.06 });
    },
    star(t, v, o) {
      const f = [784, 988, 1175][o.i || 0];
      this._tone({ type: 'triangle', f, t, d: 0.35, vol: 0.22 });
      this._tone({ type: 'sine', f: f * 2, t: t + 0.03, d: 0.3, vol: 0.08 });
      this._tone({ type: 'sine', f: f * 3, t: t + 0.06, d: 0.2, vol: 0.04 });
    },
    sight(t) {
      this._tone({ type: 'sine', f: 1200, t, d: 0.07, vol: 0.12 });
      this._tone({ type: 'sine', f: 1800, t: t + 0.08, d: 0.12, vol: 0.12 });
      this._tone({ type: 'triangle', f: 2400, t: t + 0.16, d: 0.18, vol: 0.08 });
    },
    powerUp(t) {
      [392, 523, 659, 784, 1046].forEach((f, i) => this._tone({ type: 'square', f, t: t + i * 0.05, d: 0.1, vol: 0.07, lp: 2800 }));
      this._tone({ type: 'sawtooth', f: 110, f2: 220, t, d: 0.35, vol: 0.12, lp: 900 });
    },
    quake(t) {
      this._noise({ t, a: 0.05, d: 1.5, vol: 0.6, filter: 'lowpass', freq: 220, freq2: 90, q: 1 });
      this._tone({ type: 'sine', f: 48, f2: 34, t, a: 0.05, d: 1.4, vol: 0.55, vib: 7 });
      for (let i = 0; i < 6; i++) this._noise({ t: t + 0.1 + i * 0.2 + Math.random() * 0.1, d: 0.12, vol: 0.25, filter: 'bandpass', freq: 200 + Math.random() * 300, q: 2 });
    },
    nukeOffer(t) {
      this._tone({ type: 'sine', f: 660, t, d: 0.1, vol: 0.06 });
      this._tone({ type: 'sine', f: 990, t: t + 0.1, d: 0.14, vol: 0.05 });
    },
    nukeFall(t) {
      // время замедляется
      this._tone({ type: 'sawtooth', f: 520, f2: 70, t, a: 0.02, d: 1.0, vol: 0.12, lp: 1200 });
      this._noise({ t, a: 0.05, d: 0.9, vol: 0.18, filter: 'bandpass', freq: 3000, freq2: 300, q: 1.2 });
      // свист падающей бомбы
      this._tone({ type: 'sine', f: 2100, f2: 520, t: t + 0.1, a: 0.2, d: 1.25, vol: 0.16, vib: 5 });
      this._tone({ type: 'sine', f: 2140, f2: 530, t: t + 0.1, a: 0.2, d: 1.25, vol: 0.07 });
    },
    nukeBoom(t) {
      // удар
      this._noise({ t, a: 0.003, d: 0.25, vol: 1.0, filter: 'highpass', freq: 800 });
      this._tone({ type: 'sine', f: 140, f2: 26, t, a: 0.005, d: 2.6, vol: 1.0 });
      this._tone({ type: 'triangle', f: 70, f2: 22, t, a: 0.01, d: 3.2, vol: 0.6 });
      // раскатистый грохот
      this._noise({ t, a: 0.02, d: 4.2, vol: 0.95, filter: 'lowpass', freq: 2600, freq2: 70, q: 0.6 });
      this._noise({ t: t + 0.15, a: 0.3, d: 3.5, vol: 0.45, filter: 'bandpass', freq: 400, freq2: 90, q: 0.8 });
      // треск обломков
      for (let i = 0; i < 18; i++) this._noise({ t: t + 0.2 + Math.random() * 2.2, d: 0.06 + Math.random() * 0.1, vol: 0.12 + Math.random() * 0.12, filter: 'bandpass', freq: 300 + Math.random() * 1800, q: 3 });
      // эхо
      for (let k = 1; k <= 3; k++) this._noise({ t: t + k * 0.55, a: 0.02, d: 0.9, vol: 0.35 / k, filter: 'lowpass', freq: 900 / k, q: 0.7 });
      // «звон в ушах» после вспышки
      this._tone({ type: 'sine', f: 3800, t: t + 0.05, a: 0.1, d: 2.2, vol: 0.025 });
    },
    win(t) {
      const seq = [523, 659, 784, 1046];
      seq.forEach((f, i) => {
        this._tone({ type: 'square', f, t: t + i * 0.11, d: 0.14, vol: 0.08, lp: 3200 });
        this._tone({ type: 'triangle', f, t: t + i * 0.11, d: 0.16, vol: 0.14 });
      });
      [523, 659, 784, 1046].forEach((f) => this._tone({ type: 'triangle', f, t: t + 0.5, d: 0.7, vol: 0.09 }));
    },
    lose(t) {
      const seq = [[392, 370], [349, 330], [311, 294], [294, 262]];
      seq.forEach(([a, b], i) => this._tone({
        type: 'sawtooth', f: a, f2: b, t: t + i * 0.32, a: 0.02, d: i === 3 ? 0.8 : 0.28,
        vol: 0.12, lp: 1300, vib: i === 3 ? 6 : 0,
      }));
    },
  };

  root.YB = Object.assign(root.YB || {}, { Audio: A });
})(window);

  <script>/* js/platform.js */
/* YooBird — слой платформы: Игры ВКонтакте (VK Bridge) + локальная заглушка.
 * Вся работа с рекламой, сохранениями и языком собрана здесь, остальная игра о платформе не знает.
 * Чтобы выпустить игру на другой площадке, достаточно написать ещё один адаптер с теми же методами.
 */
(function (root) {
  'use strict';
  const SAVE_KEY = 'yoobird_save_v1';
  const LAUNCH = new URLSearchParams(root.location.search);

  // Обёртка над bridge.send с таймаутом: промис никогда не «зависнет».
  function send(method, params, timeout = 8000) {
    return new Promise((resolve, reject) => {
      let done = false;
      const t = setTimeout(() => { if (!done) { done = true; reject(new Error(method + ' timeout')); } }, timeout);
      root.vkBridge.send(method, params || {}).then(
        (r) => { if (!done) { done = true; clearTimeout(t); resolve(r); } },
        (e) => { if (!done) { done = true; clearTimeout(t); reject(e); } },
      );
    });
  }

  const P = {
    name: 'local',
    isVK: false,
    adOpen: false,
    onPause: null, onResume: null,    // назначает игра
    _rewardReady: false,

    async init() {
      const b = root.vkBridge;
      // Запуск внутри ВК: есть bridge, мы во фрейме/вебвью и в URL есть параметры запуска.
      this.isVK = !!(b && LAUNCH.has('vk_app_id') && (b.isEmbedded ? b.isEmbedded() : true));
      if (!this.isVK) return;
      this.name = 'vk';
      try { await send('VKWebAppInit'); } catch (e) { console.warn('[VK] init', e); }
      b.subscribe((e) => {
        const type = e && e.detail && e.detail.type;
        if (type === 'VKWebAppViewHide') this._pause('view');
        else if (type === 'VKWebAppViewRestore') this._resume('view');
      });
      this.preloadRewarded();
    },

    lang() {
      const l = LAUNCH.get('vk_language') || (navigator.language || 'ru').slice(0, 2);
      return String(l).toLowerCase();
    },

    // У ВК нет LoadingAPI / GameplayAPI — методы оставлены, чтобы игра не зависела от площадки.
    loadingReady() {},
    gameplayStart() {},
    gameplayStop() {},

    _pause(reason = 'ad') { if (this.onPause) this.onPause(reason); },
    _resume(reason = 'ad') { if (this.onResume) this.onResume(reason); },

    // Подготовить рекламу за вознаграждение заранее (ВК подгружает ролик по CheckNativeAds).
    async preloadRewarded() {
      if (!this.isVK) { this._rewardReady = true; return true; }
      try {
        const r = await send('VKWebAppCheckNativeAds', { ad_format: 'reward' }, 10000);
        this._rewardReady = !!(r && r.result);
      } catch (e) { this._rewardReady = false; }
      return this._rewardReady;
    },

    // Межстраничная реклама. Показывать только в паузах: между уровнями, при выходе в меню.
    async showInterstitial() {
      if (!this.isVK) return false;
      this.adOpen = true; this._pause();
      let shown = false;
      try { const r = await send('VKWebAppShowNativeAds', { ad_format: 'interstitial' }, 60000); shown = !!(r && r.result); }
      catch (e) { shown = false; }
      this.adOpen = false; this._resume();
      return shown;
    },

    // Реклама за вознаграждение. true — награду выдаём.
    async showRewarded() {
      if (!this.isVK) return this._fakeRewarded();
      this.adOpen = true; this._pause();
      let ok = false;
      try { const r = await send('VKWebAppShowNativeAds', { ad_format: 'reward' }, 90000); ok = !!(r && r.result); }
      catch (e) { ok = false; }
      this.adOpen = false; this._resume();
      this.preloadRewarded();
      return ok;
    },

    // Имитация рекламы вне ВК (только для проверки логики при разработке).
    _fakeRewarded() {
      return new Promise((resolve) => {
        const el = document.getElementById('dev-ad');
        if (!el) { resolve(true); return; }
        this.adOpen = true; this._pause();
        el.classList.remove('hidden');
        const bar = el.querySelector('.dev-ad-bar span');
        let p = 0;
        const iv = setInterval(() => {
          p += 4; if (bar) bar.style.width = p + '%';
          if (p >= 100) {
            clearInterval(iv); el.classList.add('hidden'); if (bar) bar.style.width = '0%';
            this.adOpen = false; this._resume(); resolve(true);
          }
        }, 60);

  }

  // ---------- Бустеры и ядерка ----------

  }

    ctx.restore();

  <script>/* js/game.js */

(function (root) {

    canvas: null, ctx: null, dpr: 1, view: null,

    paused: false,            // пауза игрока
    extPause: new Set(),      // внешние причины: реклама, скрытая вкладка, портрет
    time: 0, acc: 0, last: 0,
    sim: null, levelIdx: 0, def: null,

    drag: null, shots: 0, bonus: 0, ending: false, endT: 0, bonusList: [], waitT: 0,
    adBirds: 0, hintsShown: new Set(),
    boosters: { sight: 1, power: 1, quake: 1 }, active: { sight: false, power: false },
    nuke: { used: false, mode: null, t: 0, x: 0, y: 0 }, timeScale: 1, flash: 0, pointer: { x: 960, y: 600 },
    parts: [], shake: 0,
    ui: null, save: null,

    init(canvas, ui) {
      this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.ui = ui;
      this.resize();
      root.addEventListener('resize', () => this.resize());
      root.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 200));
      canvas.addEventListener('pointerdown', (e) => this.onDown(e));
      root.addEventListener('pointermove', (e) => { if (this.view) this.pointer = this.toWorld(e); this.onMove(e); });
      root.addEventListener('pointerup', (e) => this.onUp(e));
      root.addEventListener('pointercancel', (e) => this.onUp(e, true));
      root.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.state === 'play') this.ui.togglePause(); });

    },

    resize() {
      const dpr = Math.min(2, root.devicePixelRatio || 1);
      const w = root.innerWidth, h = root.innerHeight;
      this.dpr = dpr;
      this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
      this.canvas.style.width = w + 'px'; this.canvas.style.height = h + 'px';
      const cw = this.canvas.width, ch = this.canvas.height;
      // Камера кадрирует игровую зону (y 240..1040), лишнее небо и земля обрезаются на широких экранах.
      const FY0 = 240, FH = 800;
      const s = Math.min(cw / C.W, ch / FH);
      const ox = (cw - C.W * s) / 2, oy = (ch - FH * s) * 0.85 - FY0 * s; // лишнее место по высоте — в основном небу

      this.drag = null; this.shots = 0; this.bonus = 0;

    },

    totalScore() { return (this.sim ? this.sim.score : 0) + this.bonus; },

    loadNext() {

    // ---------- Бустеры (по одному бесплатному на попытку) ----------
